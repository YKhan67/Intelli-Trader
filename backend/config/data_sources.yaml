price_data:
  source: "hybrid"
  # Path to your existing histdata.com ZIP files
  historical_zip_path: "D:/prj/ForexDataDL/downloads"
  local_data_path: "backend/data/raw/prices"
  pairs: ["EURUSD", "GBPUSD", "USDJPY", "USDCHF", "AUDUSD", "NZDUSD", "USDCAD", "XAUUSD", "BTCUSD", "BTCEUR"]
  timeframes: ["M1", "M5", "M15", "M30", "H1", "H4"]
  days_history: 30  # Start with 30 days, then increase to 365 or 730

gdelt:
  batch_size_days: 30
  keywords: ["USD", "EUR", "GBP", "JPY", "Fed", "ECB", "BOE", "rate", "inflation", "NFP", "CPI", "GDP", "forex", "hawkish", "dovish"]
  years_history: 2

economic_calendar:
  source: "investing.com"
  impact_levels: ["HIGH", "MEDIUM"]
  years_history: 2

cot_data:
  source: "cftc.gov"
  report_type: "legacy_futures"
