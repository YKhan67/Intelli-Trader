learner:
  # Window for training (3650 = 10 Years)
  retrain_window_days: 3650
  min_retrain_accuracy: 0.62
  
  # Model Hyperparameters for large datasets
  regime:
    n_estimators: 200
    max_depth: 10
  
  strategy:
    learning_rate: 0.05
    max_depth: 6
    n_estimators: 500

  anomaly:
    risk_multiplier: 0.25
    sensitivity: 0.95
