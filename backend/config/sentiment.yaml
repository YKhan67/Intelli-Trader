  - name: "ForexLive"
    url: "https://www.forexlive.com/rss"
  - name: "FXStreet News"
    url: "https://www.fxstreet.com/rss/news"
  - name: "DailyFX"
    url: "https://www.dailyfx.com/feeds/forex-market-news"

polling_interval_minutes: 10

thresholds:
  finbert_weight: 0.7
  vader_weight: 0.3
  min_articles_for_score: 3
  cot_strong_bias_threshold: 25000
