name: forex_ai_frontend
description: A new institutional grade AI-powered Forex trading system frontend.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Navigation
  go_router: ^12.0.0
  
  # Networking
  dio: ^5.3.0
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.0
  
  # Charts & Visualization
  fl_chart: ^0.65.0
  candlesticks: ^2.1.0
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0
  
  # Data Modeling
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  
  # Utilities
  intl: ^0.18.0
  logger: ^2.0.2
  timeago: ^3.6.0
  
  # Notifications
  flutter_local_notifications: ^16.1.0
  google_fonts: ^6.1.0
  url_launcher: ^6.3.2
  
  # Export & Sharing
  csv: ^6.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.5
  riverpod_generator: ^2.3.3
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
